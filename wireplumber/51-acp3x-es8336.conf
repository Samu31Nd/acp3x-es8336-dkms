# acp3x-es8336-dkms: WirePlumber rules for the ES8336 codec on AMD ACP3x
#
# - Keep the device open (no suspend): the speaker amplifier is switched by a
#   GPIO when the stream stops/starts, which produces an audible "click".
# - Lock the card to 48 kHz, the only rate family the codec clock setup uses,
#   so PipeWire resamples instead of driving the codec at a mismatched rate.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*acp3x-es83xx.*" }
      { node.name = "~alsa_input.*acp3x-es83xx.*" }
    ]
    actions = {
      update-props = {
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
